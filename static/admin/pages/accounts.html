<template x-if="route.name === 'accounts'">
  <div class="mx-auto max-w-4xl space-y-6 py-6">
    <!-- header -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-slate-900">账户管理</h1>
      <button type="button" @click="showCreateForm = true" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
        + 新建账户
      </button>
    </div>

    <!-- account list -->
    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-left text-sm">
        <thead class="border-b border-slate-100 bg-slate-50 text-xs font-semibold uppercase tracking-wider text-slate-500">
          <tr>
            <th class="px-5 py-3.5">用户名</th>
            <th class="px-5 py-3.5">角色</th>
            <th class="px-5 py-3.5">创建时间</th>
            <th class="px-5 py-3.5">操作</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <template x-for="user in accountList" :key="user.id">
            <tr class="hover:bg-slate-50/60">
              <td class="px-5 py-4 font-medium text-slate-900" x-text="user.username"></td>
              <td class="px-5 py-4">
                <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" :class="user.role === 'super_admin' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'" x-text="user.role === 'super_admin' ? '超级管理员' : '管理员'"></span>
              </td>
              <td class="px-5 py-4 text-slate-500" x-text="user.created_at ? new Date(user.created_at).toLocaleString('zh-CN') : '-'"></td>
              <td class="px-5 py-4">
                <div class="flex items-center gap-3">
                  <button type="button" @click="showResetPassword(user)" class="text-sm font-medium text-blue-600 hover:text-blue-800">重置密码</button>
                  <button x-show="user.role !== 'super_admin'" type="button" @click="deleteAccount(user)" class="text-sm font-medium text-red-500 hover:text-red-700">删除</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- create form modal -->
    <div x-show="showCreateForm" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30" @click.self="showCreateForm = false">
      <div class="mx-4 w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-lg">
        <h3 class="text-lg font-bold text-slate-900">新建管理员账户</h3>
        <div class="mt-4 space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">用户名</span>
            <input x-model="createForm.username" class="mt-1 w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="登录用户名" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700">密码</span>
            <input x-model="createForm.password" type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="登录密码" />
          </label>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" @click="showCreateForm = false" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700">取消</button>
          <button type="button" @click="submitCreateAccount" :disabled="createBusy" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60" x-text="createBusy ? '创建中...' : '创建'"></button>
        </div>
        <p x-show="createError" class="mt-3 text-sm text-red-600" x-text="createError"></p>
      </div>
    </div>

    <!-- delete confirm modal -->
    <div x-show="deleteTarget" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30" @click.self="deleteTarget = null">
      <div class="mx-4 w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-lg">
        <h3 class="text-lg font-bold text-slate-900">确认删除</h3>
        <p class="mt-2 text-sm text-slate-600" x-text="'确定删除账户「' + (deleteTarget?.username || '') + '」？此操作不可撤销。'"></p>
        <div class="mt-5 flex justify-end gap-3">
          <button type="button" @click="deleteTarget = null" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700">取消</button>
          <button type="button" @click="confirmDeleteAccount" :disabled="deleteBusy" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 disabled:opacity-60" x-text="deleteBusy ? '删除中...' : '删除'"></button>
        </div>
      </div>
    </div>

    <!-- reset password modal -->
    <div x-show="resetPasswordTarget" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30" @click.self="resetPasswordTarget = null">
      <div class="mx-4 w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-lg">
        <h3 class="text-lg font-bold text-slate-900">重置密码</h3>
        <p class="mt-2 text-sm text-slate-600" x-text="'为账户「' + (resetPasswordTarget?.username || '') + '」设置新密码。'"></p>
        <div class="mt-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">新密码</span>
            <input x-model="resetPasswordForm.password" type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="输入新密码" />
          </label>
        </div>
        <div class="mt-5 flex justify-end gap-3">
          <button type="button" @click="resetPasswordTarget = null" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700">取消</button>
          <button type="button" @click="confirmResetPassword" :disabled="resetBusy" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60" x-text="resetBusy ? '重置中...' : '确认重置'"></button>
        </div>
        <p x-show="resetError" class="mt-3 text-sm text-red-600" x-text="resetError"></p>
      </div>
    </div>
  </div>
</template>
